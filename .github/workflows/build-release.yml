name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            suffix: .exe
            artifact_name: DevCommandCenter-windows.exe
            add_data: "devcommandcenter/assets;devcommandcenter/assets"
          - os: ubuntu-latest
            suffix: ""
            artifact_name: DevCommandCenter-linux
            add_data: "devcommandcenter/assets:devcommandcenter/assets"
          - os: macos-latest
            suffix: ""
            artifact_name: DevCommandCenter-macos
            add_data: "devcommandcenter/assets:devcommandcenter/assets"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --name DevCommandCenter \
            --onefile \
            --windowed \
            --add-data "${{ matrix.add_data }}" \
            --hidden-import PySide6.QtSvg \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            --hidden-import sqlalchemy.ext.baked \
            --hidden-import sqlalchemy.sql.default_comparator \
            main.py

      - name: Rename artifact
        shell: bash
        run: |
          src="dist/DevCommandCenter${{ matrix.suffix }}"
          dest="dist/${{ matrix.artifact_name }}"
          mv "$src" "$dest"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Trusted Publishing (OIDC) — no API token needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${{ github.ref_name }}"; tag="${tag#v}"
          pkg=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          [ "$tag" = "$pkg" ] || { echo "Tag v$tag does not match pyproject version $pkg"; exit 1; }
          echo "Tag v$tag == pyproject $pkg"

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            $0 ~ "^## \\[" { capture=0 }
            capture { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          echo "Extracted release notes:"
          cat /tmp/release_notes.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping creation"
          else
            gh release create "$tag" artifacts/**/* \
              --title "DevCommandCenter $tag" \
              --notes-file /tmp/release_notes.md
          fi
